<svg viewBox="0 0 780 540" xmlns="http://www.w3.org/2000/svg" style="background:#fff;font-family:Inter,Arial,sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#48EFCF"/></marker></defs>
<rect x="0" y="0" width="780" height="36" fill="#153385"/>
<text x="390" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="white">k8s-es-prod — Kubernetes Workload Architecture (ECK + Supporting Services)</text>
<!-- Namespace: elastic -->
<rect x="15" y="48" width="748" height="240" rx="10" fill="#F5F7FA" stroke="#0B64DD" stroke-width="2" stroke-dasharray="8,4"/>
<text x="24" y="64" font-size="10" font-weight="bold" fill="#0B64DD">namespace: elastic (ECK managed)</text>
<!-- ES statefulsets -->
<rect x="25" y="72" width="128" height="80" rx="6" fill="#E8F0FE" stroke="#0B64DD" stroke-width="1.5"/>
<text x="89" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#0B64DD">ES Masters (3)</text>
<text x="89" y="104" text-anchor="middle" font-size="8" fill="#555">StatefulSet</text>
<text x="89" y="116" text-anchor="middle" font-size="8" fill="#888">8CPU·32GB·500GB</text>
<text x="89" y="128" text-anchor="middle" font-size="8" fill="#888">StorageClass: nvme</text>
<text x="89" y="142" text-anchor="middle" font-size="8" fill="#0B64DD">NodeAffinity: master-pool</text>
<rect x="168" y="72" width="128" height="80" rx="6" fill="#E8F0FE" stroke="#0B64DD" stroke-width="1.5"/>
<text x="232" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#0B64DD">ES Hot Data (6)</text>
<text x="232" y="104" text-anchor="middle" font-size="8" fill="#555">StatefulSet</text>
<text x="232" y="116" text-anchor="middle" font-size="8" fill="#888">16CPU·64GB·4TB NVMe</text>
<text x="232" y="128" text-anchor="middle" font-size="8" fill="#888">PVC: 2x2TB per pod</text>
<text x="232" y="142" text-anchor="middle" font-size="8" fill="#0B64DD">NodeAffinity: hot-pool</text>
<rect x="311" y="72" width="128" height="80" rx="6" fill="#FBEAF0" stroke="#F04E98" stroke-width="1.5"/>
<text x="375" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#F04E98">ES ML GPU (2)</text>
<text x="375" y="104" text-anchor="middle" font-size="8" fill="#555">StatefulSet</text>
<text x="375" y="116" text-anchor="middle" font-size="8" fill="#888">32CPU·128GB·A100 40GB</text>
<text x="375" y="128" text-anchor="middle" font-size="8" fill="#888">gpu: nvidia.com/gpu:1</text>
<text x="375" y="142" text-anchor="middle" font-size="8" fill="#F04E98">NodeAffinity: ml-pool</text>
<rect x="454" y="72" width="128" height="80" rx="6" fill="#FFF8E1" stroke="#FEC514" stroke-width="1.5"/>
<text x="518" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#B8860B">ES Warm (2)</text>
<text x="518" y="104" text-anchor="middle" font-size="8" fill="#555">StatefulSet</text>
<text x="518" y="116" text-anchor="middle" font-size="8" fill="#888">8CPU·32GB·16TB HDD</text>
<text x="518" y="128" text-anchor="middle" font-size="8" fill="#888">tier: data_warm</text>
<text x="518" y="142" text-anchor="middle" font-size="8" fill="#B8860B">NodeAffinity: warm-pool</text>
<rect x="597" y="72" width="155" height="80" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="674" y="90" text-anchor="middle" font-size="9" font-weight="bold" fill="#0F6E56">ES Coord + Kibana</text>
<text x="674" y="104" text-anchor="middle" font-size="8" fill="#555">Deployment (Coordinating)</text>
<text x="674" y="116" text-anchor="middle" font-size="8" fill="#888">2x coord: 8CPU·32GB</text>
<text x="674" y="128" text-anchor="middle" font-size="8" fill="#888">3x Kibana: 4CPU·16GB</text>
<text x="674" y="142" text-anchor="middle" font-size="8" fill="#0F6E56">Service: NodePort 443</text>
<!-- ES services -->
<rect x="25" y="165" width="740" height="30" rx="4" fill="#E8F0FE" stroke="#0B64DD" stroke-width="1"/>
<text x="390" y="183" text-anchor="middle" font-size="9" font-weight="bold" fill="#0B64DD">Services: es-prod-es-http (ClusterIP 9200) · es-prod-es-transport (ClusterIP 9300) · es-prod-kb-http (NodePort 5601)</text>
<!-- PodDisruptionBudgets -->
<rect x="25" y="204" width="740" height="24" rx="4" fill="#F5F7FA" stroke="#ccc"/>
<text x="390" y="219" text-anchor="middle" font-size="8" fill="#555">PodDisruptionBudgets: Masters minAvailable:2 · Hot Data minAvailable:4 · ML minAvailable:1 · Coordinating minAvailable:1</text>
<!-- Namespace: logstash -->
<rect x="15" y="302" width="370" height="110" rx="8" fill="#F5F7FA" stroke="#FEC514" stroke-width="2" stroke-dasharray="8,4"/>
<text x="24" y="318" font-size="10" font-weight="bold" fill="#B8860B">namespace: logstash</text>
<rect x="25" y="326" width="100" height="70" rx="5" fill="white" stroke="#FEC514" stroke-width="1.5"/>
<text x="75" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#B8860B">TXN Pipeline</text>
<text x="75" y="356" text-anchor="middle" font-size="8" fill="#888">Deployment 3x</text>
<text x="75" y="368" text-anchor="middle" font-size="8" fill="#888">4CPU·12GB</text>
<text x="75" y="382" text-anchor="middle" font-size="8" fill="#888">workers: 8</text>
<rect x="140" y="326" width="100" height="70" rx="5" fill="white" stroke="#FEC514" stroke-width="1.5"/>
<text x="190" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#B8860B">IoT Pipeline</text>
<text x="190" y="356" text-anchor="middle" font-size="8" fill="#888">Deployment 3x</text>
<text x="190" y="368" text-anchor="middle" font-size="8" fill="#888">4CPU·12GB</text>
<text x="190" y="382" text-anchor="middle" font-size="8" fill="#888">workers: 6</text>
<rect x="255" y="326" width="120" height="70" rx="5" fill="white" stroke="#FEC514" stroke-width="1.5"/>
<text x="315" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#B8860B">INT/ITKB Pipelines</text>
<text x="315" y="356" text-anchor="middle" font-size="8" fill="#888">Deployment 3x each</text>
<text x="315" y="368" text-anchor="middle" font-size="8" fill="#888">4CPU·12GB</text>
<text x="315" y="382" text-anchor="middle" font-size="8" fill="#888">workers: 4</text>
<!-- Namespace: kafka -->
<rect x="400" y="302" width="363" height="110" rx="8" fill="#F5F7FA" stroke="#F04E98" stroke-width="2" stroke-dasharray="8,4"/>
<text x="410" y="318" font-size="10" font-weight="bold" fill="#F04E98">namespace: kafka</text>
<rect x="416" y="326" width="100" height="70" rx="5" fill="white" stroke="#F04E98" stroke-width="1.5"/>
<text x="466" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#F04E98">kafka-01</text>
<text x="466" y="356" text-anchor="middle" font-size="8" fill="#888">StatefulSet</text>
<text x="466" y="368" text-anchor="middle" font-size="8" fill="#888">8CPU·32GB·4TB</text>
<text x="466" y="382" text-anchor="middle" font-size="8" fill="#888">KRaft controller</text>
<rect x="533" y="326" width="100" height="70" rx="5" fill="white" stroke="#F04E98" stroke-width="1.5"/>
<text x="583" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#F04E98">kafka-02</text>
<text x="583" y="356" text-anchor="middle" font-size="8" fill="#888">StatefulSet</text>
<text x="583" y="368" text-anchor="middle" font-size="8" fill="#888">8CPU·32GB·4TB</text>
<text x="583" y="382" text-anchor="middle" font-size="8" fill="#888">KRaft controller</text>
<rect x="650" y="326" width="100" height="70" rx="5" fill="white" stroke="#F04E98" stroke-width="1.5"/>
<text x="700" y="343" text-anchor="middle" font-size="8" font-weight="bold" fill="#F04E98">kafka-03</text>
<text x="700" y="356" text-anchor="middle" font-size="8" fill="#888">StatefulSet</text>
<text x="700" y="368" text-anchor="middle" font-size="8" fill="#888">8CPU·32GB·4TB</text>
<text x="700" y="382" text-anchor="middle" font-size="8" fill="#888">KRaft controller</text>
<!-- ArgoCD flow -->
<rect x="15" y="428" width="748" height="98" rx="8" fill="#E8F0FE" stroke="#0B64DD" stroke-width="1.5"/>
<text x="24" y="444" font-size="10" font-weight="bold" fill="#0B64DD">GitOps Deployment Flow (ArgoCD)</text>
<rect x="30" y="452" width="100" height="30" rx="4" fill="white" stroke="#0B64DD"/>
<text x="80" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0B64DD">GitHub PR</text>
<line x1="130" y1="467" x2="158" y2="467" stroke="#0B64DD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="158" y="452" width="110" height="30" rx="4" fill="white" stroke="#0B64DD"/>
<text x="213" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0B64DD">GitHub Actions CI</text>
<line x1="268" y1="467" x2="296" y2="467" stroke="#0B64DD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="296" y="452" width="100" height="30" rx="4" fill="white" stroke="#0B64DD"/>
<text x="346" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0B64DD">Merge to main</text>
<line x1="396" y1="467" x2="424" y2="467" stroke="#0B64DD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="452" width="110" height="30" rx="4" fill="white" stroke="#0B64DD"/>
<text x="479" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0B64DD">ArgoCD Sync</text>
<line x1="534" y1="467" x2="562" y2="467" stroke="#0B64DD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="562" y="452" width="110" height="30" rx="4" fill="white" stroke="#0B64DD"/>
<text x="617" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0B64DD">k8s Apply</text>
<line x1="672" y1="467" x2="700" y2="467" stroke="#0B64DD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="700" y="452" width="50" height="30" rx="4" fill="#48EFCF" stroke="#0F6E56"/>
<text x="725" y="471" text-anchor="middle" font-size="8" font-weight="bold" fill="#0F6E56">LIVE</text>
<text x="390" y="510" text-anchor="middle" font-size="9" fill="#555">All changes via GitOps — no manual kubectl apply on production. Rollback: ArgoCD → previous Git commit (&lt;5min).</text>
</svg>